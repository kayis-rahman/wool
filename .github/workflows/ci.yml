name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Unit Tests
    runs-on: [self-hosted, macOS, ARM64, wool-ci]
    timeout-minutes: 90
    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/derived-data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check memory pressure
        run: |
          memory_pressure

      - name: Create dedicated iPhone 18 Pro simulator
        run: scripts/ci-unit-tests.sh create

      - name: Build and run unit tests
        run: scripts/ci-unit-tests.sh test

      - name: Delete dedicated simulator
        if: always()
        run: scripts/ci-unit-tests.sh cleanup

      - name: Clean derived data
        if: always()
        run: |
          rm -rf "${DERIVED_DATA_PATH}"

  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: CI required summary
        run: echo "Build and unit tests passed."
